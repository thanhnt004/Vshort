
spring:
  application:
    name: config-service
  cloud:
    config:
      server:
        git:
          uri: https://github.com/thanhnt004/Vshort-config.git
          default-label: main
          search-paths: '{application}'
          basedir: /app/config-cache # Hoặc ./config-cache nếu chạy local
          clone-on-start: true
          force-pull: true
          refresh-rate: 0
server:
  port: 8888
