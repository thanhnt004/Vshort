spring:
  application:
    name: video-service
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://user-identity-service:8081/.well-known/jwks.json}
  datasource:
    url: "jdbc:postgresql://vs_postgres:5432/video_db"
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}}
    # Consumer
    consumer:
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}}
      group-id: account-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    #  Producer
    producer:
      bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}}
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3s
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms
eureka:
  client:
    serviceUrl:
      defaultZone: http://discovery-service:8761/eureka/ # Địa chỉ của Eureka Server
  instance:
    prefer-ip-address: true
seaweedfs:
  endpoint: http://seaweedfs:8333  # Hoặc URL/IP server MinIO của bạn
  access-key: S3storageAdmin           # Thay bằng Access Key thật
  secret-key: S3storageAdmin           # Thay bằng Secret Key thật
  region: us-east-1
  bucket: videos-bucket
app:
  upload:
    allowed-mime-types:
      - "video/mp4"
      - "video/x-matroska"
      - "video/quicktime"
      - "video/webm"
    max-file-size: 5GB
    allowed-extensions:
      - "mp4"
      - "mkv"
      - "mov"
      - "webm"
  storage:
    multipart:
      base-part-size: 8MB
      optimal-max-part-size: 64MB
      single-upload-threshold: 16MB
      alignment-block: 4MB
      max-file-size: 5GB
      target-parts: 1000
      min-part-size: 5MB
      hard-max-part-size: 1GB
      max-parts-limit: 10000
